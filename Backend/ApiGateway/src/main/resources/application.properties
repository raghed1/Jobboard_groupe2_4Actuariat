spring.application.name=ApiGateway
server.port=8020

# Eureka Client
eureka.client.service-url.defaultZone=http://eureka:eureka123@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ========== ROUTES STATIQUES (URI fixe, sans Eureka) ==========
# Candidat (Spring) - port 8081
spring.cloud.gateway.server.webmvc.routes[0].id=candidat-static
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/stat/mic1/candidates/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Candidature (Spring) - port 8085 (complétez le chemin de base)
spring.cloud.gateway.server.webmvc.routes[1].id=candidature-static
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8085
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/stat/mic3/candidature/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Job (Spring) - port 8082
spring.cloud.gateway.server.webmvc.routes[2].id=job-static
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/stat/api/jobs/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Meeting (NestJS) - port 8083
spring.cloud.gateway.server.webmvc.routes[3].id=meeting-static
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/stat/api/meetings/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

# Notification (Python) - port 8084
spring.cloud.gateway.server.webmvc.routes[4].id=notification-static
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/stat/api/notifications/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

# ========== ROUTES DYNAMIQUES (via Eureka, lb://) ==========
# Candidat
spring.cloud.gateway.server.webmvc.routes[5].id=candidat-dynamic
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://candidat
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/dyn/mic1/candidates/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=1

# Candidature
spring.cloud.gateway.server.webmvc.routes[6].id=candidature-dynamic
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://candidature
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/dyn/mic3/candidature/**
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=StripPrefix=1

# Job
spring.cloud.gateway.server.webmvc.routes[7].id=job-dynamic
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://job
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/dyn/api/jobs/**
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=StripPrefix=1


# ========== Route dynamique Meeting (via Eureka) ==========
spring.cloud.gateway.server.webmvc.routes[8].id=meeting-dynamic
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://MEETING
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/dyn/api/meetings/**
spring.cloud.gateway.server.webmvc.routes[8].filters[0]=StripPrefix=1

# Notification (Python)
spring.cloud.gateway.server.webmvc.routes[9].id=notification-dynamic
spring.cloud.gateway.server.webmvc.routes[9].uri=lb://NOTIFICATION
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/dyn/api/notifications/**
spring.cloud.gateway.server.webmvc.routes[9].filters[0]=StripPrefix=1

# Logs pour visualiser le routage (utile pour la question 2.b)
logging.level.org.springframework.cloud.gateway=DEBUG