spring.application.name=candidat
server.port=8081
#H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2
#DataSource
spring.datasource.username=Badia
spring.datasource.password=
#spring.datasource.url=jdbc:h2:file:./Database/Data/Candidat
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create

#Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true



# Exposer les endpoints health, info et metrics (seul health l'est par
défaut)
management.endpoints.web.exposure.include=health,info,metrics
# Afficher le détail des composants dans /health (db, diskSpace, ping…)
management.endpoint.health.show-details=always
# Variante : afficher les composants sans leurs détails
#management.endpoint.health.show-components=always
# Transmettre à Eureka le statut de /health (Job passe DOWN si la base tombe)
eureka.client.healthcheck.enabled=true
# Publier les propriétés info.* dans /actuator/info (désactivé par défaut)
management.info.env.enabled=true





# Informations publiées dans /actuator/info
info.app.name=candidat
info.app.version=1.0.0
info.app.description=Microservice de gestion des candidats
info.app.team=Pionneer