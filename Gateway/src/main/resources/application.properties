spring.application.name=Gateway
server.port=8098

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

#Routes dynamiques
#MicroserviceCandidature
spring.cloud.gateway.server.webmvc.routes[0].id=candidature
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://canditature
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/mic3/candidature/**

#spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8085


#Microservice 1 : Candidat
spring.cloud.gateway.server.webmvc.routes[1].id=candidat
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://candidat
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/mic1/candidates/**
# spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081


#Logs de routage
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.cloud.gateway.server.mvc=TRACE
logging.level.org.springframework.cloud.loadbalancer=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG